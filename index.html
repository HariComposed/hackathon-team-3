<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compose · Composed Digital</title>
  <link rel="stylesheet" href="hifi/colors_and_type.css" />
  <style>
    html, body { margin: 0; background: #FAFAFA; min-height: 100vh; }
    body { font-family: 'Poppins', system-ui, sans-serif; color: #374151; }
    *, *::before, *::after { box-sizing: border-box; }
    #root { min-height: 100vh; }
    button { font-family: inherit; }
    /* Avoid double-icon-render flash from lucide */
    [data-lucide] { display: inline-flex; }
    /* Scrollbars — subtle */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.10); border-radius: 9999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.20); background-clip: padding-box; }
    @keyframes caret { 50% { border-color: transparent; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React, Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <!-- Supabase (UMD — sets window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Hi-fi app -->
  <script type="text/babel" src="hifi/ui.jsx"></script>
  <script type="text/babel" src="hifi/Shell.jsx"></script>
  <script type="text/babel" src="hifi/Projects.jsx"></script>
  <script type="text/babel" src="hifi/Setup.jsx"></script>
  <script type="text/babel" src="hifi/Workspace.jsx"></script>
  <script type="text/babel" src="hifi/Brief.jsx"></script>
  <script type="text/babel" src="hifi/Knowledge.jsx"></script>
  <script type="text/babel" src="hifi/Handoff.jsx"></script>
  <script type="text/babel" src="hifi/Upload.jsx"></script>
  <script type="text/babel" src="hifi/Share.jsx"></script>
  <script type="text/babel" src="hifi/App.jsx"></script>
</body>
</html>
