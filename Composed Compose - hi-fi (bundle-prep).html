<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compose · Composed Digital</title>
  <link rel="stylesheet" href="hifi/colors_and_type.css" />
  <meta name="ext-resource-dependency" content="hifi/assets/logo-wordmark.svg" data-resource-id="logoWordmark" />
  <style>
    html, body { margin: 0; background: #FAFAFA; min-height: 100vh; }
    body { font-family: 'Poppins', system-ui, sans-serif; color: #374151; }
    *, *::before, *::after { box-sizing: border-box; }
    #root { min-height: 100vh; }
    button { font-family: inherit; }
    /* Avoid double-icon-render flash from lucide */
    [data-lucide] { display: inline-flex; }
    /* Scrollbars — subtle */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.10); border-radius: 9999px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,.20); background-clip: padding-box; }
    @keyframes caret { 50% { border-color: transparent; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail" data-bg-color="#FAFAFA">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#9D00FF"/>
          <stop offset="100%" stop-color="#7BB1FD"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="800" fill="#FAFAFA"/>
      <g transform="translate(360,260)">
        <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#bg)" opacity="0.35"/>
        <rect x="60" y="60" width="160" height="160" rx="32" fill="url(#bg)" opacity="0.65"/>
        <rect x="120" y="120" width="160" height="160" rx="32" fill="url(#bg)"/>
      </g>
      <text x="600" y="600" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="48" font-weight="600" fill="#1A1A2E" letter-spacing="-0.5">Compose</text>
      <text x="600" y="650" text-anchor="middle" font-family="Poppins, system-ui, sans-serif" font-size="20" font-weight="400" fill="#6B7280">Composed Digital</text>
    </svg>
  </template>

  <!-- React, Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Hi-fi app -->
  <script type="text/babel" src="hifi/ui.jsx"></script>
  <script type="text/babel" src="hifi/Shell.bundle.jsx"></script>
  <script type="text/babel" src="hifi/Projects.jsx"></script>
  <script type="text/babel" src="hifi/Setup.jsx"></script>
  <script type="text/babel" src="hifi/Workspace.jsx"></script>
  <script type="text/babel" src="hifi/Brief.jsx"></script>
  <script type="text/babel" src="hifi/Knowledge.jsx"></script>
  <script type="text/babel" src="hifi/Handoff.jsx"></script>
  <script type="text/babel" src="hifi/Upload.jsx"></script>
  <script type="text/babel" src="hifi/Share.jsx"></script>
  <script type="text/babel" src="hifi/App.jsx"></script>
</body>
</html>
